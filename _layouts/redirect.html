<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    {% assign redirect_url = page.target %}
    {% unless page.target contains '://' %}
    {% assign redirect_url = page.target | relative_url %}
    {% endunless %}
    <meta http-equiv="refresh" content="0; url={{ redirect_url | escape }}">
    <title>{{ page.title | escape }}</title>
    <script type="text/javascript">
        window.location.replace({{ redirect_url | jsonify }});
    </script>
</head>

<body>
    <p>Redirecting to <a href="{{ redirect_url | escape }}">{{ redirect_url | escape }}</a>...</p>
</body>

</html>
