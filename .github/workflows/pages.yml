name: Deploy Jekyll site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6
        with:
          enablement: true
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Dependencies
        run: |
          pip install -r requirements-dev.txt
          npm ci
          npx playwright install --with-deps chromium

      - name: Guardian - Lint YAML
        run: yamllint .

      - name: Guardian - Lint SCSS
        run: npx stylelint "**/*.scss"

      - name: Guardian - Validate Data & Assets
        run: python3 scripts/validate.py

      - name: Test custom Jekyll plugins
        run: bundle exec ruby scripts/test_plugins.rb

      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - name: Guardian - Validate SEO Metadata
        run: python3 scripts/check_seo.py
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site

      - name: Guardian - Check Site Health (Links & HTML)
        run: |
          bundle exec htmlproofer ./_site --disable-external --allow-hash-href --swap-urls "/ag-comp-arith-geom/:/" --no-check-internal-hash --no-enforce-https
          python3 scripts/check_generated_site.py

      - name: Browser smoke tests
        run: npm run test:e2e
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
      - name: Verify robots.txt and sitemap are live
        run: |
          base="${{ steps.deployment.outputs.page_url }}"
          for path in robots.txt sitemap.xml; do
            code=$(curl -o /dev/null -s -w '%{http_code}' "${base}${path}")
            if [ "$code" != "200" ]; then
              echo "::error::${base}${path} returned HTTP ${code}"
              exit 1
            fi
          done
          if ! curl -s "${base}robots.txt" | grep -qi "^sitemap:"; then
            echo "::error::robots.txt does not advertise the sitemap"
            exit 1
          fi
          echo "robots.txt and sitemap.xml verified at ${base}"
