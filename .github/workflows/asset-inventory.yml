name: Asset inventory

on:
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Generate asset inventory
        run: python3 scripts/audit_assets.py --json asset-inventory.json
      - name: Upload inventory
        uses: actions/upload-artifact@v7
        with:
          name: asset-inventory
          path: asset-inventory.json
          retention-days: 30
